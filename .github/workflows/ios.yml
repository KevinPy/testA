# Construit l'application iOS sur un exécuteur macOS et publie un .ipa NON SIGNÉ.
#
# Pourquoi non signé : signer exige un certificat Apple, qui est personnel. Le
# .ipa produit ici se signe ensuite avec VOTRE identifiant Apple, au moment de
# l'installation, par Sideloadly ou AltStore — aucun secret ne transite par CI.
#
# Voir docs/INSTALL-IPHONE.md pour la marche à suivre côté iPhone.

name: iOS — .ipa non signé

on:
  workflow_dispatch:
  push:
    branches: [claude/kids-coloring-app-tszz3d, main]
    paths:
      - 'app/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  build:
    # Exécuteur Apple Silicon : Xcode et CocoaPods y sont préinstallés.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Flutter est installé depuis l'archive officielle plutôt que par une
      # action tierce : une dépendance de moins dans la chaîne de construction.
      - name: Installer Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          set -euo pipefail
          # L'URL est lue dans l'index officiel des versions plutôt que
          # reconstruite à la main : le nom des archives diffère selon
          # l'architecture, et une convention qui change casserait la
          # construction en silence.
          ARCH=$([ "$(uname -m)" = "arm64" ] && echo "arm64" || echo "x64")
          INDEX=https://storage.googleapis.com/flutter_infra_release/releases/releases_macos.json
          URL=$(curl -fsSL "$INDEX" | jq -r \
            --arg v "$FLUTTER_VERSION" --arg a "$ARCH" '
              .base_url as $b
              | .releases[]
              | select(.channel == "stable" and .version == $v and .dart_sdk_arch == $a)
              | "\($b)/\(.archive)"' | head -1)
          test -n "$URL" || { echo "::error::Flutter $FLUTTER_VERSION ($ARCH) introuvable dans l'index"; exit 1; }
          echo "Téléchargement de $URL"
          curl -fsSL -o /tmp/flutter.zip "$URL"
          unzip -q /tmp/flutter.zip -d "$RUNNER_TOOL_CACHE"
          echo "$RUNNER_TOOL_CACHE/flutter/bin" >> "$GITHUB_PATH"

      - name: Vérifier la chaîne de construction
        run: |
          flutter --version
          xcodebuild -version

      - name: Dépendances
        working-directory: app
        run: flutter pub get

      # Les tests tournent avant la compilation : un .ipa qui embarque une
      # régression connue ne vaut pas les minutes d'exécuteur qu'il coûte.
      - name: Analyse et tests
        working-directory: app
        run: |
          flutter analyze
          flutter test

      - name: Compiler l'application iOS (sans signature)
        working-directory: app
        run: flutter build ios --release --no-codesign

      # Un .ipa est une archive zip contenant un dossier Payload/.
      # `flutter build ipa` exigerait une équipe de développement et des
      # options d'export ; on assemble donc l'archive nous-mêmes.
      - name: Assembler le .ipa
        working-directory: app
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          test -d "$APP" || { echo "::error::$APP introuvable"; exit 1; }
          rm -rf /tmp/Payload && mkdir -p /tmp/Payload
          cp -R "$APP" /tmp/Payload/
          # Un .app resté signé « ad hoc » gêne certains outils de sideload.
          rm -rf /tmp/Payload/Runner.app/_CodeSignature
          (cd /tmp && zip -qry Barbouille-unsigned.ipa Payload)
          ls -lh /tmp/Barbouille-unsigned.ipa

      # Un artefact vert ne prouve pas qu'il est installable : on interroge le
      # binaire lui-même. Chaque vérification qui échoue fait échouer le run,
      # plutôt que de livrer un .ipa que l'iPhone refusera en silence.
      - name: Vérifier le binaire
        run: |
          set -euo pipefail
          APP=/tmp/Payload/Runner.app
          BIN=$APP/Runner
          PLIST=$APP/Info.plist
          fail() { echo "::error::$1"; exit 1; }

          echo "── Architecture ──"
          file "$BIN"
          file "$BIN" | grep -q 'arm64' || fail "binaire non arm64 : inutilisable sur iPhone"
          file "$BIN" | grep -q 'Mach-O' || fail "ce n'est pas un exécutable Mach-O"

          echo "── Plateforme et version minimale ──"
          vtool -show-build "$BIN" | tee /tmp/vtool.txt
          grep -q 'platform IOS' /tmp/vtool.txt || fail "compilé pour une autre plateforme qu'iOS"

          echo "── Identité de l'application ──"
          BUNDLE=$(plutil -extract CFBundleIdentifier raw "$PLIST")
          NAME=$(plutil -extract CFBundleDisplayName raw "$PLIST")
          MINOS=$(plutil -extract MinimumOSVersion raw "$PLIST")
          FAMILY=$(plutil -extract UIDeviceFamily json "$PLIST")
          echo "  identifiant     : $BUNDLE"
          echo "  nom affiché     : $NAME"
          echo "  iOS minimal     : $MINOS"
          echo "  familles        : $FAMILY  (1 = iPhone, 2 = iPad)"
          [ "$BUNDLE" = "com.barbouille.barbouille" ] || fail "identifiant inattendu : $BUNDLE"
          [ "$NAME" = "Barbouille" ] || fail "nom affiché inattendu : $NAME"

          echo "── Ressources ──"
          test -f "$APP/Assets.car" || fail "Assets.car absent : l'icône ne s'afficherait pas"
          test -d "$APP/Frameworks/Flutter.framework" || fail "Flutter.framework absent"
          test -f "$APP/Frameworks/App.framework/App" || fail "code Dart absent"
          # Les polices et la bibliothèque de dessins voyagent dans le bundle
          # Flutter : sans elles l'application démarre sur un écran vide.
          test -f "$APP/Frameworks/App.framework/flutter_assets/AssetManifest.bin" \
            || fail "assets Flutter absents"
          ls "$APP/Frameworks/App.framework/flutter_assets/assets/fonts/" \
            | grep -q Nunito || fail "police Nunito absente du bundle"

          echo "── Signature ──"
          if [ -d "$APP/_CodeSignature" ]; then fail "le .app est encore signé"; fi
          echo "  non signé, comme attendu — la signature se fait à l'installation"

          {
            echo "APP_BUNDLE=$BUNDLE"
            echo "APP_MINOS=$MINOS"
            echo "APP_ARCH=$(file "$BIN" | sed 's/.*Mach-O 64-bit executable //')"
          } >> "$GITHUB_ENV"

      - name: Résumé
        run: |
          {
            echo "### Barbouille — .ipa non signé"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Taille | $(du -h /tmp/Barbouille-unsigned.ipa | cut -f1) |"
            echo "| Architecture | ${APP_ARCH} |"
            echo "| Identifiant | \`${APP_BUNDLE}\` |"
            echo "| iOS minimal | ${APP_MINOS} |"
            echo "| Signature | aucune — à signer à l'installation |"
            echo "| Flutter | ${FLUTTER_VERSION} |"
            echo "| Xcode | $(xcodebuild -version | head -1 | cut -d' ' -f2) |"
            echo ""
            echo "Téléchargez l'artefact ci-dessous, puis suivez"
            echo "\`docs/INSTALL-IPHONE.md\` pour l'installer sur l'iPhone."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Barbouille-ipa-non-signe
          path: /tmp/Barbouille-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
